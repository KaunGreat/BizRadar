# ============================================================
# BizRadar · Alembic — миграции схемы БД
#
# Строка подключения НЕ задаётся здесь: alembic/env.py подставляет
# DATABASE_URL из окружения (тот же, что использует рантайм в db.py).
#   prod (Docker): postgresql://bizradar:****@db:5432/bizradar
#   локально:      sqlite:///.../backend/data/bizradar.db (дефолт)
#
# Команды (из backend/):
#   alembic upgrade head                       # накатить все миграции
#   alembic revision --autogenerate -m "описание"   # создать новую
#   alembic current / alembic history          # состояние / история
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url намеренно пуст — значение приходит из DATABASE_URL (env.py)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
